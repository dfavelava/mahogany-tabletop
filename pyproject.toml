[project]
name = "discordbot"
version = "0.1.0"
description = "Discord bot for the Daybid connectome memory service"
readme = "README.md"
authors = [
    { name = "David Favela", email = "dfavelava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.4.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
discordbot = "discordbot.bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.0",
    "ty>=0.0.1a10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ty.src]
include = ["src"]
